<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ClaimTrace — check claims against sources, review assessments, and keep a clear correction history." />
    <meta name="theme-color" content="#f7f8f5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Space+Grotesk:wght@500..700&display=swap"
      rel="stylesheet"
    />
    <title>ClaimTrace</title>
    <script>
      // Apply the saved theme (light by default) before first paint to avoid a flash.
      var theme = 'light';
      try {
        theme = localStorage.getItem('claimtrace.theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {}
      if (theme === 'dark') document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
