# The cloud version. Set POSTGRES_PASSWORD in a root .env, and API keys in backend/.env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claimtrace
      POSTGRES_USER: claimtrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimtrace"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://claimtrace:${POSTGRES_PASSWORD}@postgres/claimtrace
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '[]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
