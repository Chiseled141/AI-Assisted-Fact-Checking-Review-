# OpenRouter models. IDs from https://openrouter.ai/models, checked on 2026-11-02.
# Each call requests exactly the model named here; there is no fallback to another model.
# Restart the backend after editing. Judge keys and names must match `frontend/src/config.ts`.

[openrouter]
base_url = "https://openrouter.ai/api/v1"
timeout_seconds = 45

[roles]
# Splits the input into claims and asks for charts.
extraction = "anthropic/claude-haiku-5.5"
# Turns a question into a claim, searches with Tavily, chooses each claim's sources, and reads figures for charts.
research = "anthropic/claude-haiku-5.5"
# Judges ticked by default in the new-check form.
default_judges = ["gpt-luna", "claude-haiku"]

# What the user can pick from in the new-check form.
# Set `supports_json_mode = false` for a model that rejects OpenRouter's JSON mode.

[judges.claude-haiku]
name = "Claude Haiku 5.5"
model = "anthropic/claude-haiku-5.5"

[judges.deepseek-flash]
name = "DeepSeek Flash V4.1"
model = "deepseek/deepseek-v4.1-flash"

[judges.gpt-luna]
name = "GPT Luna"
model = "openai/gpt-6-luna"

[judges.glm-5-3-flash]
name = "GLM 5.3 Flash"
model = "z-ai/glm-5.3-flash"

[judges.qwen-flash]
name = "Qwen3.8 Flash"
model = "qwen/qwen3.8-flash"

[judges.minimax-flash]
name = "MiniMax M3.1 Flash"
model = "minimax/minimax-m3.1-flash"

[judges.gemma-4-31b]
name = "Gemma 4 31B"
model = "google/gemma-4-31b-it:free"

[judges.nemotron-ultra]
name = "Nemotron 3 Ultra"
model = "nvidia/nemotron-3-ultra-550b-a55b"
supports_json_mode = false
